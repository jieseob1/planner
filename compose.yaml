services:
  mysql:
    image: mysql:8.4.10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${NOWLINE_MYSQL_DB:-nowline}
      MYSQL_USER: ${NOWLINE_MYSQL_USER:-nowline}
      MYSQL_PASSWORD: ${NOWLINE_MYSQL_PASSWORD:-nowline-local-only}
      MYSQL_ROOT_PASSWORD: ${NOWLINE_MYSQL_ROOT_PASSWORD:-nowline-root-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - nowline-mysql-data:/var/lib/mysql
    networks:
      default:
        aliases:
          - nowline-mysql

  backend:
    image: nowline-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${NOWLINE_MYSQL_DB:-nowline}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_as_ci&serverTimezone=UTC&preserveInstants=true
      SPRING_DATASOURCE_USERNAME: ${NOWLINE_MYSQL_USER:-nowline}
      SPRING_DATASOURCE_PASSWORD: ${NOWLINE_MYSQL_PASSWORD:-nowline-local-only}
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: local-auth
      NOWLINE_OIDC_ISSUER: https://identity.local.nowline.invalid
      NOWLINE_OIDC_AUDIENCE: nowline-api
      NOWLINE_DEV_JWT_SECRET: nowline-local-development-jwt-secret-change-before-production
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
      MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 -O - http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NOWLINE_BACKEND_PORT:-8080}:8080"
    networks:
      default:
        aliases:
          - nowline-backend

  frontend:
    image: nowline-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 -O - http://127.0.0.1:8080/healthz | grep -qx ok
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NOWLINE_FRONTEND_PORT:-8088}:8080"

volumes:
  nowline-mysql-data:
    name: ${NOWLINE_MYSQL_VOLUME:-nowline-mysql-data}
