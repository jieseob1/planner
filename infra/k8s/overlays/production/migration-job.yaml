apiVersion: batch/v1
kind: Job
metadata:
  name: nowline-migrate
  namespace: nowline-production
  labels:
    app.kubernetes.io/name: nowline
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nowline
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: nowline-backend
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migration
          image: ghcr.io/jieseob1/planner-backend:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef: {name: nowline-production-secrets, key: db-url}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: nowline-production-secrets, key: db-username}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: nowline-production-secrets, key: db-password}
            - name: NOWLINE_OIDC_ISSUER
              valueFrom:
                secretKeyRef: {name: nowline-production-secrets, key: oidc-issuer}
            - name: NOWLINE_OIDC_AUDIENCE
              valueFrom:
                secretKeyRef: {name: nowline-production-secrets, key: oidc-audience}
            - {name: NOWLINE_WORKERS_ENABLED, value: "false"}
            - {name: NOWLINE_MIGRATION_ONLY, value: "true"}
            - {name: SPRING_MAIN_WEB_APPLICATION_TYPE, value: "none"}
            - {name: SPRING_FLYWAY_ENABLED, value: "true"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
