[SERVICE]
    Flush 2
    Grace 5
    Log_Level error
    Parsers_File /fluent-bit/etc/nowline/parsers.conf
    HTTP_Server Off
    storage.path /state/buffer
    storage.sync normal
    storage.checksum on
    storage.backlog.mem_limit 4M

[INPUT]
    Name tail
    Tag nowline.backend
    Path /var/log/pods/nowline-local_nowline-backend-*/*/*.log
    Parser cri
    DB /state/backend.db
    Read_from_Head false
    Mem_Buf_Limit 4M
    Buffer_Chunk_Size 16k
    Buffer_Max_Size 32k
    Skip_Long_Lines On
    storage.type filesystem

[INPUT]
    Name tail
    Tag nowline.frontend
    Path /var/log/pods/nowline-local_nowline-frontend-*/*/*.log
    Parser cri
    DB /state/frontend.db
    Read_from_Head false
    Mem_Buf_Limit 4M
    Buffer_Chunk_Size 16k
    Buffer_Max_Size 32k
    Skip_Long_Lines On
    storage.type filesystem

[INPUT]
    Name tail
    Tag nowline.keycloak
    Path /var/log/pods/nowline-local_nowline-keycloak-*/*/*.log
    Parser cri
    DB /state/keycloak.db
    Read_from_Head false
    Mem_Buf_Limit 4M
    Buffer_Chunk_Size 16k
    Buffer_Max_Size 32k
    Skip_Long_Lines On
    storage.type filesystem

[INPUT]
    Name tail
    Tag nowline.mysql
    Path /var/log/pods/nowline-local_nowline-mysql-*/*/*.log
    Parser cri
    DB /state/mysql.db
    Read_from_Head false
    Mem_Buf_Limit 4M
    Buffer_Chunk_Size 16k
    Buffer_Max_Size 32k
    Skip_Long_Lines On
    storage.type filesystem

[FILTER]
    Name lua
    Match nowline.*
    script /fluent-bit/etc/nowline/sanitize.lua
    call sanitize
    protected_mode true

[OUTPUT]
    Name loki
    Match nowline.*
    Host nowline-loki.nowline-observability.svc.cluster.local
    Port 3100
    Labels cluster=nowline-local-kind,namespace=nowline-local,component=$component,level=$level
    Line_Format json
    Remove_Keys component,level
    Retry_Limit 5
    storage.total_limit_size 32M
