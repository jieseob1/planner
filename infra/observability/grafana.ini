[server]
root_url = https://goalstotoday.com/ops/grafana/
serve_from_sub_path = true
router_logging = false
[security]
disable_initial_admin_creation = true
cookie_secure = true
cookie_samesite = lax
disable_gravatar = true
content_security_policy = true
[users]
allow_sign_up = false
allow_org_create = false
[auth]
disable_login_form = true
login_maximum_inactive_lifetime_duration = 15m
login_maximum_lifetime_duration = 1h
token_rotation_interval_minutes = 5
[auth.basic]
enabled = false
[auth.anonymous]
enabled = false
[auth.generic_oauth]
enabled = true
name = Goals to Today
allow_sign_up = true
client_id = nowline-grafana
client_secret = $__file{/etc/grafana-secret/client-secret}
scopes = openid profile email roles
auth_url = https://goalstotoday.com/idp/realms/nowline/protocol/openid-connect/auth
token_url = https://goalstotoday.com/idp/realms/nowline/protocol/openid-connect/token
api_url = https://goalstotoday.com/idp/realms/nowline/protocol/openid-connect/userinfo
use_pkce = true
use_refresh_token = true
role_attribute_path = contains(realm_access.roles[*], 'nowline-admin') && 'Admin'
role_attribute_strict = true
skip_org_role_sync = false
allow_assign_grafana_admin = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[log]
mode = console
level = warn
