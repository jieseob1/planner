name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - name: Audit production dependencies
        timeout-minutes: 3
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRIES: "1"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "5000"
        run: |
          for attempt in 1 2 3; do
            if audit_output=$(npm audit --omit=dev --audit-level=moderate 2>&1); then
              printf '%s\n' "$audit_output"
              exit 0
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"
            if ! printf '%s\n' "$audit_output" | grep -Eiq 'audit endpoint returned an error|network timeout|503 Service Unavailable|EAI_AGAIN|ECONNRESET|ETIMEDOUT'; then
              exit "$audit_status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning title=npm audit unavailable::The npm audit service did not respond after 3 attempts; dependency installation and all remaining CI checks will continue."
              exit 0
            fi
            echo "npm audit service unavailable on attempt $attempt; retrying..."
            sleep $((attempt * 5))
          done
      - run: npm run verify:release

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -q verify
        working-directory: backend

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run verify:k8s

  end-to-end:
    runs-on: ubuntu-latest
    needs: [frontend, backend, manifests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: npm ci --no-audit
      - run: npm run verify:e2e
      - run: npm run verify:production:e2e
