version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups:
      frontend-minor:
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /backend
    schedule: {interval: weekly}
    groups:
      backend-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
