services:
  mysql-keycloak-bootstrap:
    image: mysql:8.4.10
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${NOWLINE_MYSQL_ROOT_PASSWORD:?Run scripts/prepare-local-beta-env.sh first}
      KEYCLOAK_DB_PASSWORD: ${NOWLINE_KEYCLOAK_DB_PASSWORD:?Run scripts/prepare-local-beta-env.sh first}
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-keycloak.sh"]
    volumes:
      - ./infra/k8s/overlays/local/files/bootstrap-keycloak.sh:/bootstrap/bootstrap-keycloak.sh:ro
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: nowline-keycloak:local
    build:
      context: ./infra/keycloak
      dockerfile: Containerfile
    depends_on:
      mysql-keycloak-bootstrap:
        condition: service_completed_successfully
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${NOWLINE_KEYCLOAK_DB_PASSWORD:?Run scripts/prepare-local-beta-env.sh first}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${NOWLINE_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NOWLINE_KEYCLOAK_ADMIN_PASSWORD:?Run scripts/prepare-local-beta-env.sh first}
      KC_HOSTNAME: ${NOWLINE_PUBLIC_ORIGIN:-http://localhost:8088}/idp
      KC_HOSTNAME_ADMIN: ${NOWLINE_ADMIN_ORIGIN:-http://localhost:9090}/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      NOWLINE_PUBLIC_ORIGIN: ${NOWLINE_PUBLIC_ORIGIN:-http://localhost:8088}
    volumes:
      - ./infra/k8s/overlays/local/files/nowline-realm.json:/opt/keycloak/data/import/nowline-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /idp/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${NOWLINE_KEYCLOAK_ADMIN_PORT:-9090}:8080"
    networks:
      default:
        aliases:
          - nowline-keycloak

  backend:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ""
      NOWLINE_DEV_JWT_SECRET: ""
      NOWLINE_OIDC_ISSUER: ${NOWLINE_PUBLIC_ORIGIN:-http://localhost:8088}/idp/realms/nowline
      NOWLINE_OIDC_AUDIENCE: nowline-api
      NOWLINE_OIDC_JWK_SET_URI: http://nowline-keycloak:8080/idp/realms/nowline/protocol/openid-connect/certs

  frontend:
    image: nowline-frontend-beta:local
    build:
      context: .
      dockerfile: Dockerfile.beta
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
